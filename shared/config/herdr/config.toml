onboarding = false
ui.sidebar_collapsed_mode = "hidden"
[keys]
prefix = "ctrl+space"
detach = "prefix+d"
next_agent = "prefix+a"
rename_tab = "prefix+comma"
split_horizontal = "prefix+\""
split_vertical = "prefix+%"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "open Herdr Navigator"

[terminal]
kitty_graphics = true

[ui.toast]
delivery = "herdr"
delay_seconds = 0

[ui.sound]
enabled = true

[ui.sound.agents]
pi = "on"

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  [
    { token = "$agent_progress_pct_early", fg = "#a9b1d6" },
    { token = "$agent_progress_pct_mid", fg = "#7aa2f7" },
    { token = "$agent_progress_pct_late", fg = "#7dcfff" },
    { token = "$agent_progress_pct_done", fg = "#9ece6a", bold = true },
    "agent",
    { token = "$agent_progress_freshness", fg = "#e0af68" },
  ],
  ["$agent_progress_activity"],
]
